version: '3.8'

services:
  app:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - lens-data:/var/lib/lens:ro
      - lens-cache:/var/cache/lens
    environment:
      - LENS_DATA_DIR=/var/lib/lens
      - LENS_CACHE_DIR=/var/cache/lens
      - LENS_LOG_DIR=/var/log/lens
      - PORT=3000
      - PUBLIC_URL=http://localhost:8081
      - SIMULATION_API_URL=http://simulation:8081
      # Local dev bypasses login. For production set PRISM_AUTH_MODE=local
      # (or hybrid/ldap) and provide LENS_INTERNAL_AUTH_SECRET.
      - PRISM_AUTH_MODE=disabled
      - PRISM_ALLOW_UNAUTHENTICATED=true
      - LENS_INTERNAL_AUTH_SECRET=dev-internal-secret
    ports:
      - "8081:5173"
      - "3000:3000"
    command: sh -c "npm install && npm run dev:web"
    depends_on:
      - simulation

  simulation:
    build:
      context: .
      dockerfile: Dockerfile.simulation
    environment:
      - LENS_DATA_DIR=/var/lib/lens
      - LENS_CACHE_DIR=/var/cache/lens
      - LENS_LOG_DIR=/var/log/lens
      # Keep auth consistent with the Node gateway; production must replace
      # these dev values (see docs/design/auth-rbac-design.md section 13.1).
      - PRISM_AUTH_MODE=disabled
      - PRISM_ALLOW_UNAUTHENTICATED=true
      - LENS_SECRET_KEY=dev-secret-key
      - LENS_INTERNAL_AUTH_SECRET=dev-internal-secret
    volumes:
      - lens-data:/var/lib/lens
      - lens-cache:/var/cache/lens
      - lens-logs:/var/log/lens
    expose:
      - "8081"

volumes:
  lens-data:
  lens-cache:
  lens-logs:
